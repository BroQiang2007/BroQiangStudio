<!DOCTYPE html>
<html lang="zh-TW" data-theme="dark">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">

<body>

    <!-- 頂部透明導覽列 -->
    <header class="top-bar">
        <button class="menu-btn" id="menuBtn">☰</button>

            <a href="games.html" data-i18n="nav_games">遊戲日常</a>
        </nav>
        <div class="settings-wrapper desktop-only">
            <button class="settings-icon-btn" id="desktopSettingsBtn">⚙️</button>
            <div class="settings-dropdown" id="desktopDropdown">
                <select class="lang-selector">
                    <option value="zh-TW">繁體中文</option>
                    <option value="zh-CN">简体中文</option>
                    <option value="en">English</option>
                    <option value="ms">Bahasa Melayu</option>
                </select>
                <button class="theme-toggle-btn">
                    <span class="theme-icon">☀️</span> <span class="theme-text">日間模式</span>
                </button>
            </div>
        </div>
    </header>

    <!-- 手機側邊欄 -->
    <aside class="sidebar" id="sidebar">
        <button class="close-btn" id="closeBtn">×</button>
        <nav class="sidebar-nav">
            <a href="index.html" class="active" data-i18n="nav_about">關於我</a>
            <a href="resume.html" data-i18n="nav_resume">專業履歷</a>

            <a href="games.html" data-i18n="nav_games">遊戲日常</a>
        </nav>
        <div class="settings-wrapper mobile-only mobile-settings">
            <div class="settings-dropdown" id="mobileDropdown">
                <select class="lang-selector">
                    <option value="zh-TW">繁體中文</option>
                    <option value="zh-CN">简体中文</option>
                    <option value="en">English</option>
                    <option value="ms">Bahasa Melayu</option>
                </select>
                <button class="theme-toggle-btn">
                    <span class="theme-icon">☀️</span> <span class="theme-text">日間模式</span>
                </button>
            </div>
            <button class="settings-icon-btn" id="mobileSettingsBtn">⚙️</button>
        </div>
    </aside>

    <main>
        <section class="hero-section">
            <div class="hero-bg">
                <!-- 背景影片或圖片 -->
                <video src="Drift.mp4" autoplay loop muted playsinline></video>
                <div class="overlay"></div>
            </div>
            <div class="hero-content">
                <img src="ProfilePicture.jpg" alt="Profile Picture" class="profile-pic">
                <h1 data-i18n="hero_title">嗨，我是 余樂鈜</h1>
                <p class="subtitle" data-i18n="hero_subtitle">熱愛用程式解決問題的開發者 / 喜歡用設計說故事的創作者。</p>
            </div>

    <footer class="site-footer">
        <div class="footer-container">
            <div class="footer-col">
                <h4 data-i18n="footer_title_1">BroQiangStudio</h4>
                <p data-i18n="footer_desc">致力於網頁開發、多媒體設計與創意專案。歡迎與我聯繫交流！</p>
            </div>
            <div class="footer-col">
                <h4 data-i18n="footer_title_2">快速導覽</h4>
                <ul>

                    <li><a href="resume.html" data-i18n="nav_resume">專業履歷</a></li>
                </ul>
            </div>
            <div class="footer-col">
                <h4 data-i18n="footer_title_3">社群平台</h4>
                <ul>
                    <li><a href="#">Instagram</a></li>
                    <li><a href="#">YouTube</a></li>

        </div>
        <div class="footer-bottom">
            <p>&copy; 2026 BroQiangStudio. All rights reserved.</p>
        </div>
