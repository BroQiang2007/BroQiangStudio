                "hero_desc": "Seorang pembangun yang bersemangat menyelesaikan masalah / Pencipta yang suka bercerita melalui reka bentuk.",
                "footer_contact": "Hubungi saya: anle82760@gmail.com",
                "footer_rights": "BroQiangStudio. Hak Cipta Terpelihara."
            }
        };

        function changeLanguage() {
            const lang = document.getElementById("languageSelect").value;
            document.querySelectorAll("[data-i18n]").forEach(el => {
                const key = el.getAttribute("data-i18n");
                if (translations[lang] && translations[lang][key]) {
                    el.textContent = translations[lang][key];
                }
            });
            localStorage.setItem("selectedLanguage", lang);
        }

        window.onload = function() {
            const savedLang = localStorage.getItem("selectedLanguage");
            if (savedLang) {
                document.getElementById("languageSelect").value = savedLang;
                changeLanguage();
            }
        };
    </script>
