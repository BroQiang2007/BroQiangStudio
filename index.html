<!DOCTYPE html>
<html lang="zh-TW" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="page_title_home">首頁 | BroQiangStudio</title>
    <link rel="icon" href="Pictures/ProfilePicture.jpg" type="image/jpeg">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- ==================== 開屏動畫與攔截器 ==================== -->
    <div id="splash-screen">
      <div class="splash-loader"></div>
      <div class="splash-text" id="splash-text">INITIALIZING...</div>
    </div>
    <script>
      (function() {
        const savedTheme = localStorage.getItem('preferredTheme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);
        const savedColor = localStorage.getItem('preferredColor') || '#e50914';
        document.documentElement.style.setProperty('--accent-color', savedColor);
        const savedPerf = localStorage.getItem('performanceMode') || 'high';
        document.documentElement.setAttribute('data-performance', savedPerf);
        document.documentElement.classList.add('splash-active');
        
        let lang = localStorage.getItem('preferredLang');
        if (!lang) {
            const navLang = navigator.language.toLowerCase();
            if (navLang.includes('zh-tw') || navLang.includes('zh-hk')) lang = 'zh-TW';
            else if (navLang.includes('zh')) lang = 'zh-CN';
            else if (navLang.includes('ms') || navLang.includes('id')) lang = 'ms';
            else if (navLang.includes('en')) lang = 'en';
            else lang = 'en'; 
            localStorage.setItem('preferredLang', lang);
        }
        const splashText = document.getElementById('splash-text');
        if (splashText) {
          const isInitialized = sessionStorage.getItem('siteInitialized');
          if (!isInitialized) {
            splashText.setAttribute('data-i18n', 'initializing');
            if (lang === 'zh-TW') splashText.textContent = '系統初始化中...';
            else if (lang === 'zh-CN') splashText.textContent = '系统初始化中...';
            else if (lang === 'ms') splashText.textContent = 'MEMULAKAN...';
            else splashText.textContent = 'INITIALIZING...';
            sessionStorage.setItem('siteInitialized', 'true');
          } else {
            splashText.setAttribute('data-i18n', 'loading');
            if (lang === 'zh-TW') splashText.textContent = '載入中...';
            else if (lang === 'zh-CN') splashText.textContent = '加载中...';
            else if (lang === 'ms') splashText.textContent = 'MEMUATKAN...';
            else splashText.textContent = 'LOADING...';
          }
        }
      })();
    </script>
    <!-- ==================== 開屏動畫結束 ==================== -->

    <header class="top-bar">
        <button class="menu-btn" id="menuBtn">☰</button>
        <nav class="desktop-nav">

        </nav>
        <div class="top-right-controls">

                        <option value="zh-TW">繁體中文</option>
                        <option value="zh-CN">简体中文</option>
                        <option value="en">English</option>
                        <option value="ms">Bahasa Melayu</option>
                    </select>
                    <button class="theme-toggle-btn"><span class="theme-icon">☀️</span> <span class="theme-text">日間模式</span></button>
                    <button class="sound-toggle-btn"><span class="sound-icon">🔇</span> <span class="sound-text">聲音：靜音</span></button>
                    <button class="perf-toggle-btn"><span class="perf-icon">⚡</span> <span class="perf-text" data-i18n="perf_high">效能：極致</span></button>
                    <div class="color-picker-wrapper">
                        <span class="color-picker-title" data-i18n="color_picker_title">主題色</span>
                        <div class="color-dots">
                            <span class="color-dot" data-color="#e50914" style="background: #e50914;" title="Bugatti Red"></span>
                            <span class="color-dot" data-color="#ff9800" style="background: #ff9800;" title="Lambo Orange"></span>
                            <span class="color-dot" data-color="#00bcd4" style="background: #00bcd4;" title="Tech Blue"></span>
                            <span class="color-dot" data-color="#4caf50" style="background: #4caf50;" title="Eco Green"></span>
                        </div>
                    </div>
                    <button class="reset-btn" data-i18n="reset_btn">🔄 恢復預設</button>
                </div>
            </div>
        </div>

                <div class="color-picker-wrapper">

    <main class="hero-section">

            <!-- 這裡是你的影片背景設定 -->

        <div class="hero-content">
            <img src="Pictures/ProfilePicture.jpg" alt="Avatar" class="profile-pic">
            <h1 data-i18n="hero_title">嗨，我是 余樂銨</h1>

                    <i class="icon">👁️</i> <span data-i18n="stat_daily">今日訪客：</span><strong id="daily-visitors">0</strong>
                </span>
                <span class="divider">|</span>
                <span class="stat-item">
                    <i class="icon">🚀</i> <span data-i18n="stat_total">歷史總量：</span><strong id="total-visitors">0</strong>
                </span>
            </div>
        </div>

    <script src="script.js"></script>
</body>
