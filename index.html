    <!-- ================= 完整的語言切換系統 ================= -->
    <script>
        const translations = {
            "zh-TW": {
                "nav_about": "關於我", "nav_resume": "專業履歷", "nav_portfolio": "作品集",
                "hero_title": "嗨，我是 余樂銨",
                "hero_desc": "熱愛用程式解決問題的開發者 / 喜歡用設計說故事的創作者。",
                "footer_contact": "聯絡我：anle82760@gmail.com",
                "footer_rights": "BroQiangStudio. 版權所有.",
                "social_douyin": "抖音"
            },
            "zh-CN": {
                "nav_about": "关于我", "nav_resume": "专业履历", "nav_portfolio": "作品集",
                "hero_title": "嗨，我是 余乐铵",
                "hero_desc": "热爱用程式解决问题的开发者 / 喜欢用设计说故事的创作者。",
                "footer_contact": "联系我：anle82760@gmail.com",
                "footer_rights": "BroQiangStudio. 版权所有.",
                "social_douyin": "抖音"
            },
            "en": {
                "nav_about": "About Me", "nav_resume": "Resume", "nav_portfolio": "Portfolio",
                "hero_title": "Hi, I'm MICHAEL ER",
                "hero_desc": "A developer passionate about solving problems / A creator who loves storytelling through design.",
                "footer_contact": "Contact me: anle82760@gmail.com",
                "footer_rights": "BroQiangStudio. All Rights Reserved.",
                "social_douyin": "DouYin"
            },
            "ms": {
                "nav_about": "Mengenai Saya", "nav_resume": "Resume", "nav_portfolio": "Portfolio",
                "hero_title": "Hai, saya ER LE AN",
                "hero_desc": "Seorang pembangun yang bersemangat menyelesaikan masalah / Pencipta yang suka bercerita melalui reka bentuk.",
                "footer_contact": "Hubungi saya: anle82760@gmail.com",
                "footer_rights": "BroQiangStudio. Hak Cipta Terpelihara.",
                "social_douyin": "DouYin"
            }
        };

        function changeLanguage() {
            const lang = document.getElementById("languageSelect").value;
            document.querySelectorAll("[data-i18n]").forEach(el => {
                const key = el.getAttribute("data-i18n");
                if (translations[lang] && translations[lang][key]) {
                    el.textContent = translations[lang][key];
                }
            });
            localStorage.setItem("selectedLanguage", lang);
        }

        window.onload = function() {
            const savedLang = localStorage.getItem("selectedLanguage");
            if (savedLang) {
                document.getElementById("languageSelect").value = savedLang;
                changeLanguage();
            }
        };
    </script>
</body>
