<!DOCTYPE html>
<html lang="zh-TW" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>首頁 | BroQiangStudio</title>
    <link rel="icon" href="ProfilePicture.jpg" type="image/jpeg">
    <!-- 這行是最重要的，它載入了剛剛的 CSS -->
    <link rel="stylesheet" href="style.css"> 
</head>
<body>
    <header class="top-bar">
        <button class="menu-btn" id="menuBtn">☰</button>
        <nav class="desktop-nav">
            <a href="index.html" class="active">關於我</a>
            <a href="resume.html">專業履歷</a>
            <a href="portfolio.html">作品集</a>
            <a href="games.html">遊戲日常</a>
        </nav>
        <div class="top-right-controls">
            <!-- 首頁專屬：了解更多按鈕 -->
            <a href="about-me.html" class="intro-btn desktop-only">了解更多</a>
            <div class="settings-wrapper desktop-only">
                <button class="settings-icon-btn" id="desktopSettingsBtn">⚙️</button>
                <div class="settings-dropdown" id="desktopDropdown">
                    <select class="lang-selector">
                        <option value="zh-TW">繁體中文</option>
                        <option value="zh-CN">简体中文</option>
                        <option value="en">English</option>
                        <option value="ms">Bahasa Melayu</option>
                    </select>
                    <button class="theme-toggle-btn"><span class="theme-icon">☀️</span> <span class="theme-text">日間模式</span></button>
                </div>
            </div>
        </div>
    </header>

    <aside class="sidebar" id="sidebar">
        <button class="close-btn" id="closeBtn">×</button>
        <nav class="sidebar-nav">
            <a href="index.html" class="active">關於我</a>
            <a href="resume.html">專業履歷</a>
            <a href="portfolio.html">作品集</a>
            <a href="games.html">遊戲日常</a>
        </nav>
        <div class="settings-wrapper mobile-only mobile-settings">
            <div class="settings-dropdown" id="mobileDropdown">
                <select class="lang-selector">
                    <option value="zh-TW">繁體中文</option>
                </select>
                <button class="theme-toggle-btn"><span class="theme-icon">☀️</span> <span class="theme-text">日間模式</span></button>
            </div>
            <button class="settings-icon-btn" id="mobileSettingsBtn">⚙️</button>
        </div>
    </aside>

    <main class="hero-section">
        <div class="hero-bg">
            <video src="background.mp4" autoplay loop muted playsinline></video>
            <div class="overlay"></div>
        </div>
        <div class="hero-content">
            <img src="ProfilePicture.jpg" alt="BroQiang" class="profile-pic">
            <h1>BroQiang Studio</h1>
            <p class="subtitle">網頁開發 × 多媒體設計</p>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
