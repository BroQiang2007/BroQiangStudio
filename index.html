<!DOCTYPE html>
<html lang="zh-TW" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="page_title_home">首頁 | BroQiangStudio</title>
    <link rel="icon" href="Pictures/ProfilePicture.jpg" type="image/jpeg">
    <link rel="stylesheet" href="style.css">
    
    <!-- 👇 就是這裡原本被你不小心刪壞了，我幫你補回完美的 <style> 標籤 -->
    <style>
        html, body {
            height: 100%;
            padding: 0;
            margin: 0;
            background-color: black;
        }
        canvas {
            position: absolute;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <!-- ==================== 開屏動畫與攔截器 ==================== -->
    <div id="welcome-screen">
        <h1 class="welcome-text" id="welcome-text"></h1>
    </div>
    
    <div id="splash-screen">
      <div class="splash-loader"></div>
      <div class="splash-text" id="splash-text">INITIALIZING...</div>
    </div>
    
    <script>
      (function() {
        const savedTheme = localStorage.getItem('preferredTheme') || 'dark'; document.documentElement.setAttribute('data-theme', savedTheme);
        const savedColor = localStorage.getItem('preferredColor') || '#e50914'; document.documentElement.style.setProperty('--accent-color', savedColor);
        const savedPerf = localStorage.getItem('performanceMode') || 'high'; document.documentElement.setAttribute('data-performance', savedPerf);
        document.documentElement.classList.add('splash-active');
        
        let lang = localStorage.getItem('preferredLang');
        if (!lang) {
            const navLang = navigator.language.toLowerCase();
            if (navLang.includes('zh-tw') || navLang.includes('zh-hk')) lang = 'zh-TW';
            else if (navLang.includes('zh')) lang = 'zh-CN'; 
            else if (navLang.includes('ms') || navLang.includes('id')) lang = 'ms'; 
            else lang = 'en';
            localStorage.setItem('preferredLang', lang);
        }

        const splashText = document.getElementById('splash-text');
        const welcomeScreen = document.getElementById('welcome-screen');
        const welcomeText = document.getElementById('welcome-text');
        
        // 判斷狀態的雙重保險
        const isFirstTimeVisitor = !localStorage.getItem('hasVisitedBroQiang'); // 是否這輩子第一次來
        const isNewSession = !sessionStorage.getItem('siteInitialized'); // 是否為本次「剛打開網站」
        
        // 傳遞給 script.js 決定要不要播完整動畫
        window.showWelcome = isNewSession; 
        const bqStyled = '<span style="color: var(--accent-color);">BroQiangStudio</span>';

        if (isNewSession) {
            // 【只要是這次剛打開網站，就播迎賓動畫！】
            if (isFirstTimeVisitor) {
                // 1. 全新用戶：歡迎光臨
                if (lang === 'zh-TW') welcomeText.innerHTML = `歡迎光臨進入 ${bqStyled} 的網站！`;
                else if (lang === 'zh-CN') welcomeText.innerHTML = `欢迎光临进入 ${bqStyled} 的网站！`;
                else if (lang === 'ms') welcomeText.innerHTML = `Selamat Datang ke Laman Web ${bqStyled}!`;
                else welcomeText.innerHTML = `Welcome to ${bqStyled}!`;
            } else {
                // 2. 老用戶回歸：歡迎回到
                if (lang === 'zh-TW') welcomeText.innerHTML = `歡迎回到 ${bqStyled} 的網站！`;
                else if (lang === 'zh-CN') welcomeText.innerHTML = `欢迎回到 ${bqStyled} 的网站！`;
                else if (lang === 'ms') welcomeText.innerHTML = `Selamat Kembali ke Laman Web ${bqStyled}!`;
                else welcomeText.innerHTML = `Welcome back to ${bqStyled}!`;
            }

            if (splashText) {
                splashText.setAttribute('data-i18n', 'initializing');
                if (lang === 'zh-TW') splashText.textContent = '網站初始化中...';
                else if (lang === 'zh-CN') splashText.textContent = '网站初始化中...';
                else if (lang === 'ms') splashText.textContent = 'MEMULAKAN...';
                else splashText.textContent = 'INITIALIZING...';
            }
        } else {
            // 【已經在網站內部點擊按鈕切換頁面】：直接隱藏迎賓畫面，快速通關
            if (welcomeScreen) welcomeScreen.style.display = 'none';
            if (splashText) {
                splashText.setAttribute('data-i18n', 'loading');
                if (lang === 'zh-TW') splashText.textContent = '載入中...';
                else if (lang === 'zh-CN') splashText.textContent = '加载中...';
                else if (lang === 'ms') splashText.textContent = 'MEMUATKAN...';
                else splashText.textContent = 'LOADING...';
            }
        }
      })();
    </script>
    <!-- ==================== 開屏動畫結束 ==================== -->

    <header class="top-bar">
        <button class="menu-btn" id="menuBtn">☰</button>
        <nav class="desktop-nav">
            <a href="index.html" class="active" data-i18n="nav_about">關於我</a>
            <a href="resume.html" data-i18n="nav_resume">專業履歷</a>
            <a href="portfolio.html" data-i18n="nav_portfolio">作品集</a>
            <a href="games.html" data-i18n="nav_games">遊戲日常</a>
        </nav>
        <div class="top-right-controls">
            <a href="about-me.html" class="intro-btn" data-i18n="intro_btn">了解更多</a>
            <div class="settings-wrapper desktop-only">
                <button class="settings-icon-btn" id="desktopSettingsBtn">⚙️</button>
                <div class="settings-dropdown" id="desktopDropdown">
                    <select class="lang-selector">
                        <option value="zh-TW">繁體中文</option>
                        <option value="zh-CN">简体中文</option>
                        <option value="en">English</option>
                        <option value="ms">Bahasa Melayu</option>
                    </select>
                    <button class="theme-toggle-btn"><span class="theme-icon">☀️</span> <span class="theme-text">日間模式</span></button>
                    <button class="sound-toggle-btn"><span class="sound-icon">🔇</span> <span class="sound-text">聲音：靜音</span></button>
                    <button class="perf-toggle-btn"><span class="perf-icon">⚡</span> <span class="perf-text" data-i18n="perf_high">效能：極致</span></button>
                    <div class="color-picker-wrapper">
                        <span class="color-picker-title" data-i18n="color_picker_title">主題色</span>
                        <div class="color-dots">
                            <span class="color-dot" data-color="#e50914" style="background: #e50914;" title="Bugatti Red"></span>
                            <span class="color-dot" data-color="#ff9800" style="background: #ff9800;" title="Lambo Orange"></span>
                            <span class="color-dot" data-color="#00bcd4" style="background: #00bcd4;" title="Tech Blue"></span>
                            <span class="color-dot" data-color="#4caf50" style="background: #4caf50;" title="Eco Green"></span>
                        </div>
                    </div>
                    <button class="reset-btn" data-i18n="reset_btn">🔄 恢復預設</button>
                </div>
            </div>
        </div>
    </header>

    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h2 class="sidebar-title" data-i18n="sidebar_menu">選單</h2>
            <button class="close-btn" id="closeBtn">×</button>
        </div>
        <nav class="sidebar-nav">
            <a href="index.html" class="active" data-i18n="nav_about">關於我</a>
            <a href="resume.html" data-i18n="nav_resume">專業履歷</a>
            <a href="portfolio.html" data-i18n="nav_portfolio">作品集</a>
            <a href="games.html" data-i18n="nav_games">遊戲日常</a>
        </nav>
        <div class="settings-wrapper mobile-only mobile-settings">
            <div class="settings-dropdown" id="mobileDropdown">
                <select class="lang-selector">
                    <option value="zh-TW">繁體中文</option>
                    <option value="zh-CN">简体中文</option>
                    <option value="en">English</option>
                    <option value="ms">Bahasa Melayu</option>
                </select>
                <button class="theme-toggle-btn"><span class="theme-icon">☀️</span> <span class="theme-text">日間模式</span></button>
                <button class="sound-toggle-btn"><span class="sound-icon">🔇</span> <span class="sound-text">聲音：靜音</span></button>
                <button class="perf-toggle-btn"><span class="perf-icon">⚡</span> <span class="perf-text" data-i18n="perf_high">效能：極致</span></button>
                <div class="color-picker-wrapper">
                    <span class="color-picker-title" data-i18n="color_picker_title">主題色</span>
                    <div class="color-dots">
                        <span class="color-dot" data-color="#e50914" style="background: #e50914;" title="Bugatti Red"></span>
                        <span class="color-dot" data-color="#ff9800" style="background: #ff9800;" title="Lambo Orange"></span>
                        <span class="color-dot" data-color="#00bcd4" style="background: #00bcd4;" title="Tech Blue"></span>
                        <span class="color-dot" data-color="#4caf50" style="background: #4caf50;" title="Eco Green"></span>
                    </div>
                </div>
                <button class="reset-btn" data-i18n="reset_btn">🔄 恢復預設</button>
            </div>
            <button class="settings-icon-btn" id="mobileSettingsBtn">⚙️</button>
        </div>
    </aside>

    <main class="hero-section">
        <div class="hero-bg">
            <!-- 這裡是你的影片背景設定 -->
            <video id="bgVideo" src="Videos/heart-python.mp4" autoplay loop muted playsinline></video>
            <div class="overlay"></div>
        </div>
        <div class="hero-content">
            <img src="Pictures/ProfilePicture.jpg" alt="Avatar" class="profile-pic">
            <h1 data-i18n="hero_title">嗨，我是 余樂銨</h1>
            <p class="subtitle" data-i18n="hero_subtitle">熱愛用程式解決問題的開發者 / 喜歡用設計說故事的創作者。</p>
            
            <div class="visitor-stats">
                <span class="stat-item">
                    <i class="icon">👁️</i> <span data-i18n="stat_daily">今日訪客：</span><strong id="daily-visitors">0</strong>
                </span>
                <span class="divider">|</span>
                <span class="stat-item">
                    <i class="icon">🚀</i> <span data-i18n="stat_total">歷史總量：</span><strong id="total-visitors">0</strong>
                </span>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
