<!DOCTYPE html>
<html lang="zh-TW" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>第五人格 | 遊戲詳情</title>
    <link rel="icon" href="Pictures/ProfilePicture.jpg" type="image/jpeg">
    <link rel="stylesheet" href="style.css">
    <style>
        .game-detail-container { display: flex; flex-direction: column; gap: 30px; max-width: 900px; margin: 0 auto; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 20px; padding: 30px; backdrop-filter: blur(10px); }
        @media (min-width: 768px) { .game-detail-container { flex-direction: row; } }
        .detail-image-card { padding: 0 !important; border: 2px solid var(--accent-color) !important; background: transparent !important; width: 100%; max-width: 400px; margin: 0 auto; box-shadow: none !important; }
        .detail-image-card:hover { transform: scale(1.02) !important; box-shadow: 0 0 20px var(--accent-color) !important; }
        .detail-image-card .reveal-img-wrapper { margin-bottom: 0; border-radius: 13px; }
        
        .game-info { flex: 1; display: flex; flex-direction: column; gap: 20px; }
        .game-info h3 { font-size: 2rem; color: var(--accent-color); margin-bottom: 10px; }
        .game-info p { color: var(--text-color); font-size: 1.05rem; line-height: 1.8; text-align: justify; }
        .download-links { display: flex; flex-wrap: wrap; gap: 15px; margin-top: auto; }
        .download-links .intro-btn { flex: 1; text-align: center; min-width: 140px; padding: 12px 10px; font-size: 0.95rem; display: flex; justify-content: center; align-items: center; }
    </style>
</head>
<body>
    <div id="splash-screen"><div class="splash-loader"></div><div class="splash-text" id="splash-text">INITIALIZING...</div></div>
    <script>
      (function() {
        const savedTheme = localStorage.getItem('preferredTheme') || 'dark'; document.documentElement.setAttribute('data-theme', savedTheme);
        const savedColor = localStorage.getItem('preferredColor') || '#e50914'; document.documentElement.style.setProperty('--accent-color', savedColor);
        const savedPerf = localStorage.getItem('performanceMode') || 'high'; document.documentElement.setAttribute('data-performance', savedPerf);
        document.documentElement.classList.add('splash-active');
        let lang = localStorage.getItem('preferredLang');
        if (!lang) {
            const navLang = navigator.language.toLowerCase();
            if (navLang.includes('zh-tw') || navLang.includes('zh-hk')) lang = 'zh-TW'; else if (navLang.includes('zh')) lang = 'zh-CN'; else if (navLang.includes('ms') || navLang.includes('id')) lang = 'ms'; else lang = 'en';
            localStorage.setItem('preferredLang', lang);
        }
        const splashText = document.getElementById('splash-text');
        if (splashText) {
          const isInit = sessionStorage.getItem('siteInitialized'); splashText.setAttribute('data-i18n', isInit ? 'loading' : 'initializing');
          if (lang === 'zh-TW') splashText.textContent = isInit ? '載入中...' : '系統初始化中...'; else if (lang === 'zh-CN') splashText.textContent = isInit ? '加载中...' : '系统初始化中...'; else if (lang === 'ms') splashText.textContent = isInit ? 'MEMUATKAN...' : 'MEMULAKAN...'; else splashText.textContent = isInit ? 'LOADING...' : 'INITIALIZING...';
          if (!isInit) sessionStorage.setItem('siteInitialized', 'true');
        }
      })();
    </script>

    <header class="top-bar">
        <button class="menu-btn" id="menuBtn">☰</button>
        <nav class="desktop-nav"><a href="index.html" data-i18n="nav_about">關於我</a><a href="resume.html" data-i18n="nav_resume">專業履歷</a><a href="portfolio.html" data-i18n="nav_portfolio">作品集</a><a href="games.html" class="active" data-i18n="nav_games">遊戲日常</a></nav>
        <div class="top-right-controls">
            <div class="settings-wrapper desktop-only">
                <button class="settings-icon-btn" id="desktopSettingsBtn">⚙️</button>
                <div class="settings-dropdown" id="desktopDropdown">
                    <select class="lang-selector"><option value="zh-TW">繁體中文</option><option value="zh-CN">简体中文</option><option value="en">English</option><option value="ms">Bahasa Melayu</option></select>
                    <button class="theme-toggle-btn"><span class="theme-icon">☀️</span> <span class="theme-text">日間模式</span></button>
                    <button class="sound-toggle-btn"><span class="sound-icon">🔇</span> <span class="sound-text">聲音：靜音</span></button>
                    <button class="perf-toggle-btn"><span class="perf-icon">⚡</span> <span class="perf-text" data-i18n="perf_high">效能：極致</span></button>
                    <div class="color-picker-wrapper"><span class="color-picker-title" data-i18n="color_picker_title">主題色</span><div class="color-dots"><span class="color-dot" data-color="#e50914" style="background: #e50914;"></span><span class="color-dot" data-color="#ff9800" style="background: #ff9800;"></span><span class="color-dot" data-color="#00bcd4" style="background: #00bcd4;"></span><span class="color-dot" data-color="#4caf50" style="background: #4caf50;"></span></div></div>
                    <button class="reset-btn" data-i18n="reset_btn">🔄 恢復預設</button>
                </div>
            </div>
        </div>
    </header>

    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header"><h2 class="sidebar-title" data-i18n="sidebar_menu">選單</h2><button class="close-btn" id="closeBtn">×</button></div>
        <nav class="sidebar-nav"><a href="index.html" data-i18n="nav_about">關於我</a><a href="resume.html" data-i18n="nav_resume">專業履歷</a><a href="portfolio.html" data-i18n="nav_portfolio">作品集</a><a href="games.html" class="active" data-i18n="nav_games">遊戲日常</a></nav>
        <div class="settings-wrapper mobile-only mobile-settings">
            <div class="settings-dropdown" id="mobileDropdown">
                <select class="lang-selector"><option value="zh-TW">繁體中文</option><option value="zh-CN">简体中文</option><option value="en">English</option><option value="ms">Bahasa Melayu</option></select>
                <button class="theme-toggle-btn"><span class="theme-icon">☀️</span> <span class="theme-text">日間模式</span></button>
                <button class="sound-toggle-btn"><span class="sound-icon">🔇</span> <span class="sound-text">聲音：靜音</span></button>
                <button class="perf-toggle-btn"><span class="perf-icon">⚡</span> <span class="perf-text" data-i18n="perf_high">效能：極致</span></button>
                <div class="color-picker-wrapper"><span class="color-picker-title" data-i18n="color_picker_title">主題色</span><div class="color-dots"><span class="color-dot" data-color="#e50914" style="background: #e50914;"></span><span class="color-dot" data-color="#ff9800" style="background: #ff9800;"></span><span class="color-dot" data-color="#00bcd4" style="background: #00bcd4;"></span><span class="color-dot" data-color="#4caf50" style="background: #4caf50;"></span></div></div>
                <button class="reset-btn" data-i18n="reset_btn">🔄 恢復預設</button>
            </div>
            <button class="settings-icon-btn" id="mobileSettingsBtn">⚙️</button>
        </div>
    </aside>
    
    <main class="page-content">
        <a href="games.html" class="btn-link" style="margin-bottom: 20px; display: inline-block; font-size: 1.1rem;">← 返回遊戲列表</a>
        <div class="game-detail-container">
            <div class="card detail-image-card">
                <div class="reveal-img-wrapper">
                    <img src="Pictures/idv.jpg" alt="第五人格" class="img-front">
                    <video src="Videos/idv-doctor.mp4" class="media-back" loop muted playsinline></video>
                </div>
            </div>
            <div class="game-info">
                <h3 data-i18n="game_2_title">第五人格 (國際服)</h3>
                <p>《第五人格》是網易首款非對稱性對抗競技手遊。荒誕的哥德畫風、懸疑燒腦的劇情，以及刺激的 1V4 追逃玩法，帶來全新的遊戲體驗。玩家可以選擇扮演監管者或求生者，在莊園中展開激烈的心理與策略博弈。</p>
                <p>📍 <strong>特色亮點：</strong> 1V4 非對稱競技、豐富的角色技能搭配、獨特的懸疑畫風。</p>
                <div class="download-links">
                    <a href="https://idv.163.com/" target="_blank" class="intro-btn">🌐 官方網站</a>
                    <a href="https://idv.163.com/" target="_blank" class="intro-btn">💻 PC 互通版</a>
                    <a href="https://idv.163.com/" target="_blank" class="intro-btn">📱 手機版下載</a>
                </div>
            </div>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
